name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 brings the annotated tag object along -- its message is
      # the release notes below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: The tag must match project.version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag ${GITHUB_REF_NAME} -> ${tag}; pyproject project.version -> ${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error file=pyproject.toml::tag ${GITHUB_REF_NAME} does not match project.version ${version}"
            echo "Bump project.version, commit, delete the tag and re-tag."
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      # Nothing without both Mojo sources reaches PyPI; see the same check in
      # ci.yml for why the listing is matched from a here-string.
      - name: The Mojo custom op sources are inside the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          listing="$(unzip -l "$wheel")"
          echo "$listing"
          for f in unlimited_ocr_max/kernels/__init__.mojo \
                   unlimited_ocr_max/kernels/ngram_block.mojo; do
            grep -qE "[[:space:]]${f}$" <<<"$listing" \
              || { echo "::error file=pyproject.toml::${f} is missing from ${wheel}"; exit 1; }
          done

      - name: Metadata is valid
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Release notes are the tag message
        run: |
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="unlimited-ocr-max ${GITHUB_REF_NAME}"
          fi
          printf '%s\n' "$notes" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # The environment name is part of what PyPI's trusted publisher matches on;
    # it must stay `pypi` (see CONTRIBUTING.md "One-time PyPI setup").
    environment:
      name: pypi
      url: https://pypi.org/p/unlimited-ocr-max
    permissions:
      # Trusted Publishing: this short-lived OIDC token *is* the credential.
      # No PyPI API token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # PyPA recommends tracking the `release/v1` branch so fixes arrive without
      # a bump; this pin is the stricter choice -- the commit `release/v1`
      # pointed at on 2026-09-06, which is also what the v1.14.2 tag resolves
      # to. Re-pin it when you want the newer release.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)

      # Fallback, if you would rather not set up Trusted Publishing: create a
      # project-scoped API token on pypi.org, store it as the repository secret
      # PYPI_API_TOKEN, delete the `permissions: id-token: write` block above,
      # and replace the publish step with:
      #
      # - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: .
      # `gh` is preinstalled on the runner, so the release needs no third-party
      # action at all: the job's own `contents: write` GITHUB_TOKEN is the only
      # credential. This job never checks the repository out, so `gh` cannot
      # infer the repo from a git remote -- GH_REPO tells it. `failglob` turns
      # an empty `dist/` into a hard failure instead of uploading a literal
      # `dist/*`, and `--verify-tag` refuses to create a release for a tag that
      # is not on the remote.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s failglob
          ls -l dist/*
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "unlimited-ocr-max $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
