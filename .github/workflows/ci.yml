name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      # Pyflakes rules only: undefined names, unused imports, f-string mistakes.
      # No style opinions -- this package has no ruff config to disagree with.
      - name: ruff (F rules)
        run: uvx ruff@0.16.6 check --select F unlimited_ocr_max tests

  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # macOS arm64 is the platform this port is validated on; Linux x86_64 is
      # what MAX targets first and what most `pip install` users are on. The
      # tests are model-free -- they import the architecture but never open a
      # device or compile a kernel, so neither runner needs a GPU (nor the
      # Metal Toolchain, which MAX only shells out to when it compiles Metal
      # kernels at serve time). fail-fast off: one platform failing must not
      # hide the other's result. If the Linux leg ever becomes a nuisance
      # (torch pulls the CUDA wheels there), drop `ubuntu-latest` from the list.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # Builds the sdist, then the wheel *from* the sdist, so a file missing
      # from the sdist cannot be present in the wheel.
      - name: Build wheel and sdist
        run: uv build

      # The listing is captured once and matched from a here-string: with
      # `pipefail` on, `unzip -l | grep -q` fails intermittently because grep
      # exits on the first match and unzip dies of SIGPIPE.
      - name: The Mojo custom op sources are inside the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          listing="$(unzip -l "$wheel")"
          echo "$listing"
          for f in unlimited_ocr_max/kernels/__init__.mojo \
                   unlimited_ocr_max/kernels/ngram_block.mojo \
                   unlimited_ocr_max/kernels/moe_int8.mojo; do
            grep -qE "[[:space:]]${f}$" <<<"$listing" \
              || { echo "::error file=pyproject.toml::${f} is missing from ${wheel}"; exit 1; }
          done

      - name: Metadata is valid
        run: uv run --no-project --with twine twine check --strict dist/*

      # The venv lives outside the checkout so the tests import the *installed*
      # wheel (site-packages), never the source tree next to them -- that is
      # what makes the kernels/*.mojo and `max` version assertions meaningful.
      # `max[all]==26.6.0` comes from PyPI like everything else; no extra index.
      # The `test` extra is what brings pytest and torch in -- torch is not a
      # runtime dependency of the wheel itself, only of this extra (the
      # bit-exactness oracle a few tests hold their numpy conversions against).
      # The download may still be slow (hence the timeout, ~4 GB of wheels on
      # Linux, where the extra's torch pulls the CUDA stack); it may not fail.
      - name: Install the built wheel into a fresh venv
        timeout-minutes: 30
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" \
            "$(ls dist/*.whl)[test]"

      # The model-free set: every file under tests/, no weights and no server
      # needed. The count has one home -- see CONTRIBUTING.md.
      - name: pytest
        run: |
          "$RUNNER_TEMP/venv/bin/pytest" tests -q -m "not slow"

      - name: Console script
        run: |
          "$RUNNER_TEMP/venv/bin/unlimited-ocr-max" --help

      # The property the whole torch-removal run (KON-190..194) exists to
      # deliver, pinned in CI rather than only verified by hand: installing
      # the wheel with no extras must not resolve torch, and every weight-free
      # path must still work. A separate venv from the `pytest` steps above,
      # which install the `test` extra (torch included) on purpose -- so this
      # is the only place in the matrix where torch is *genuinely* absent, and
      # therefore the only place the property can honestly be proved. A test
      # inside the suite could only simulate the absence (by blocking the name)
      # and would prove something about the simulation instead.
      # `-P` is required: unlike pytest (which inserts each test file's own
      # directory, not the checkout root, into sys.path), a bare `python -c`
      # prepends cwd -- $GITHUB_WORKSPACE, which contains this very package's
      # source -- and would silently check the checkout instead of the wheel.
      # The `site-packages` assertion is what makes dropping `-P` fail loudly
      # instead of turning this step into a no-op against the source tree.
      # The Python below sits at the block scalar's own indentation, which YAML
      # strips, so every statement reaches the shell at column 0 -- indenting it
      # any further inside the `run: |` block would be an IndentationError, and
      # any less would end the block scalar. Single quotes throughout: the outer
      # shell string is double-quoted.
      - name: The wheel installs and imports without torch
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv-no-extras"
          uv pip install --python "$RUNNER_TEMP/venv-no-extras" "$(ls dist/*.whl)"
          "$RUNNER_TEMP/venv-no-extras/bin/python" -P -c "
          import importlib.util
          assert importlib.util.find_spec('torch') is None, 'the no-extras install resolved torch'

          import unlimited_ocr_max
          assert 'site-packages' in unlimited_ocr_max.__file__, unlimited_ocr_max.__file__

          from unlimited_ocr_max.cli import build_parser
          args = build_parser().parse_args(['serve', '--devices', 'cpu'])
          assert args.command == 'serve', args

          from PIL import Image
          from unlimited_ocr_max.batch_processor import preprocess_page
          pixels = preprocess_page(Image.new('RGB', (48, 32), color=(10, 20, 30)), base_size=64)
          assert pixels.shape == (1, 3, 64, 64), pixels.shape

          from unlimited_ocr_max.tokenizer import build_prompt
          assert build_prompt(lambda text: [7] * len(text.split()), prompt='<image>hello world').seq_len > 0

          print('no-extras: import, CLI parser, preprocess_page and build_prompt all work without torch')
          "
